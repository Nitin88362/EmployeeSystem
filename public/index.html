<script>
// =================== API CLIENT ===================
const API = {
  token: localStorage.getItem('editone_token') || null,
  setToken(t) { this.token = t; if (t) localStorage.setItem('editone_token', t); else localStorage.removeItem('editone_token'); },
  async req(method, path, body) {
    const headers = { 'Content-Type': 'application/json' };
    if (this.token) headers['Authorization'] = 'Bearer ' + this.token;
    const opts = { method, headers };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(path, opts);
    if (res.status === 401) {
      this.setToken(null);
      S.user = null; S.role = null; S.view = 'landing';
      render();
      throw new Error('Unauthorized — please login again');
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  },
  get(p) { return this.req('GET', p); },
  post(p, b) { return this.req('POST', p, b); },
  put(p, b) { return this.req('PUT', p, b); },
  del(p) { return this.req('DELETE', p); },
};

// =================== STORAGE (compatibility wrapper) ===================
// Kept minimal — actual state lives in `S` and is synced via API
const DB = {
  async get() { return null; },
  async set() { return true; },
  async del() { return true; },
};

// =================== STATE ===================
const S = {
  user: null, role: null, view: 'landing',
  adminTab: 'dashboard', empTab: 'dashboard',
  viewEmpId: null, viewEmpTab: 'overview',
  config: { officeIn:'09:00', officeOut:'17:30', overtimeCap:'21:00', gracePeriod:10, workingDays:6, otRate:1.5,
            officeLat: 28.6448, officeLng: 77.1391, officeName: 'Editone International, Naraina', maxDistance: 500 },
  leaveTypes: [
    { id:'casual', name:'Casual Leave', annual:12, color:'yellow', paid:true },
    { id:'sick', name:'Sick Leave', annual:12, color:'red', paid:true },
    { id:'earned', name:'Earned Leave', annual:15, color:'green', paid:true },
    { id:'lop', name:'Loss of Pay', annual:0, color:'gray', paid:false },
  ],
  departments: [], employees: [], attendance: [], leaves: [],
  holidays: [], notices: [], regularizations: [], payroll: [],
  todayQR: null,
  selMonth: new Date().getMonth(), selYear: new Date().getFullYear(),
  scanning: false, scanner: null, empLocation: null,
  modal: null, search: '',
};

// =================== UTILITIES ===================
const today = () => new Date().toISOString().split('T')[0];
const nowHM = () => { const d=new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).substr(2,5);
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '—';
const fmtShortDate = d => d ? new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short'}) : '—';
const fmtDateTime = d => new Date(d).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const monthName = m => ['January','February','March','April','May','June','July','August','September','October','November','December'][m];
const shortMonth = m => ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m];
const timeToMin = t => { if(!t) return 0; const [h,m] = t.split(':').map(Number); return h*60+(m||0); };
const minToTime = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const fmtDur = m => m<=0?'—':`${Math.floor(m/60)}h ${m%60}m`;
const inr = n => '₹' + (n||0).toLocaleString('en-IN', { maximumFractionDigits:0 });
const daysBetween = (a,b) => Math.floor((new Date(b) - new Date(a))/86400000) + 1;
const isWeekend = d => { const x=new Date(d); return x.getDay()===0 || x.getDay()===6; };
const inRange = (d, from, to) => d >= from && d <= to;

// Haversine distance in meters between two lat/lng points
function distanceMeters(lat1, lng1, lat2, lng2) {
  if (!lat1 || !lat2) return null;
  const R = 6371000;
  const toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

function verifyScanLocation(loc) {
  // Returns {ok, distance, message, badge}
  if (!loc || !loc.lat) return { ok:false, message:'Location not captured', badge:'badge-red' };
  if (!S.config.officeLat) return { ok:true, message:'Office location not configured', badge:'badge-yellow' };
  const dist = distanceMeters(loc.lat, loc.lng, S.config.officeLat, S.config.officeLng);
  if (dist === null) return { ok:true, message:'Distance unknown', badge:'badge-yellow' };
  if (dist <= S.config.maxDistance) return { ok:true, distance:dist, message:`✓ Verified · ${dist}m from office`, badge:'badge-green' };
  if (dist <= S.config.maxDistance * 4) return { ok:false, distance:dist, message:`⚠ ${dist}m from office (outside range)`, badge:'badge-yellow' };
  return { ok:false, distance:dist, message:`❌ ${(dist/1000).toFixed(1)}km from office — suspicious`, badge:'badge-red' };
}

function computeAtt(checkIn, checkOut, cfg) {
  const oI=timeToMin(cfg.officeIn), oO=timeToMin(cfg.officeOut), cap=timeToMin(cfg.overtimeCap);
  const iM = checkIn?timeToMin(checkIn):0, oM = checkOut?timeToMin(checkOut):0;
  const r = { lateMinutes:0, earlyOutMinutes:0, overtimeMinutes:0, workedMinutes:0, inStatus:'on-time', outStatus:'pending' };
  if (checkIn) {
    if (iM > oI + cfg.gracePeriod) { r.lateMinutes = iM - oI; r.inStatus='late'; }
    else if (iM < oI) r.inStatus='early';
  }
  if (checkOut) {
    r.workedMinutes = Math.max(0, Math.min(oM, cap) - Math.max(iM, 0));
    if (oM < oO) { r.earlyOutMinutes = oO - oM; r.outStatus='early-out'; }
    else if (oM > oO) { r.overtimeMinutes = Math.min(oM, cap) - oO; r.outStatus='overtime'; }
    else r.outStatus='on-time';
  }
  return r;
}

function workingDaysIn(year, month, holidays, weeklyOff=1) {
  // weeklyOff: 0=no off, 1=sunday only, 2=sat+sun
  const days = new Date(year, month+1, 0).getDate();
  let count = 0;
  for (let d=1; d<=days; d++) {
    const dt = new Date(year, month, d);
    const dow = dt.getDay();
    const dStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isOff = weeklyOff === 2 ? (dow===0 || dow===6) : (dow === 0);
    const isHoliday = holidays.some(h => h.date === dStr);
    if (!isOff && !isHoliday) count++;
  }
  return count;
}

// =================== INIT (loads everything from backend) ===================
async function init() {
  try {
    const [config, leaveTypes, departments, employees, attendance, leaves, holidays, notices, regularizations, payroll, qr] = await Promise.all([
      API.get('/api/config'),
      API.get('/api/leave-types'),
      API.get('/api/departments'),
      S.role === 'admin' ? API.get('/api/employees') : Promise.resolve([]),
      API.get('/api/attendance'),
      API.get('/api/leaves'),
      API.get('/api/holidays'),
      API.get('/api/notices'),
      API.get('/api/regularizations'),
      API.get('/api/payroll'),
      API.get('/api/qr/today'),
    ]);
    S.config = config;
    S.leaveTypes = leaveTypes;
    S.departments = departments;
    S.employees = employees;
    S.attendance = attendance;
    S.leaves = leaves;
    S.holidays = holidays;
    S.notices = notices;
    S.regularizations = regularizations;
    S.payroll = payroll;
    S.todayQR = qr;
  } catch (e) {
    console.error('Init error:', e);
  }
}

async function refreshData() {
  await init();
  render();
}

// Legacy save helpers — now route through API. Kept as no-ops for compatibility.
const save = {
  emp: () => Promise.resolve(),
  att: () => Promise.resolve(),
  leave: () => Promise.resolve(),
  dept: () => Promise.resolve(),
  hol: () => Promise.resolve(),
  notice: () => Promise.resolve(),
  reg: () => Promise.resolve(),
  payroll: () => Promise.resolve(),
  config: () => Promise.resolve(),
  ltypes: () => Promise.resolve(),
};

// =================== ROUTER ===================
function render() {
  const app = document.getElementById('app');
  if (S.view === 'landing') app.innerHTML = vLanding();
  else if (S.view === 'adminLogin') app.innerHTML = vAdminLogin();
  else if (S.view === 'empLogin') app.innerHTML = vEmpLogin();
  else if (S.view === 'admin') app.innerHTML = vAdmin();
  else if (S.view === 'employee') app.innerHTML = vEmp();
  attachHandlers();
  postRender();
}

function postRender() {
  if (S.view === 'admin' && S.adminTab === 'qr') drawQR();
  if (S.view === 'admin' && S.adminTab === 'dashboard') drawDashboardCharts();
  if (S.view === 'admin' && S.adminTab === 'reports') drawReports();
}

function aRoute() {

  switch(S.adminTab) {

    case 'qr': return aQR();
    case 'employees': return aEmployees();
    case 'departments': return aDepartments();
    case 'attendance': return aAttendance();
    case 'yearly': return aYearly();
    case 'payroll': return aPayroll();
    case 'leaves': return aLeaves();
    case 'regularization': return aRegularization();
    case 'holidays': return aHolidays();
    case 'notices': return aNotices();

  return '';
}

function drawDashboardCharts() {
  const trendCanvas = document.getElementById('trendChart');
  if (trendCanvas) {
    const labels = [], pres = [], abs = [];
    for (let i=6; i>=0; i--) {
      const d = new Date(Date.now() - i*86400000);
      const ds = d.toISOString().split('T')[0];
      labels.push(d.toLocaleDateString('en-IN',{weekday:'short'}));
      const c = S.attendance.filter(a => a.date === ds).length;
      pres.push(c);
      abs.push(Math.max(0, S.employees.filter(e=>e.status==='active').length - c));
    }
    new Chart(trendCanvas, {
      type:'bar',
      data:{ labels, datasets:[
        { label:'Present', data:pres, backgroundColor:'rgba(16,185,129,0.7)', borderRadius:6 },
        { label:'Absent', data:abs, backgroundColor:'rgba(239,68,68,0.5)', borderRadius:6 }
      ]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ labels:{ color:'#8a8a93' } } },
        scales:{ x:{ ticks:{color:'#8a8a93'}, grid:{display:false} }, y:{ ticks:{color:'#8a8a93'}, grid:{color:'#26262d'} } } }
    });
  }
  const deptCanvas = document.getElementById('deptChart');
  if (deptCanvas) {
    const counts = {};
    S.employees.forEach(e => { counts[e.department] = (counts[e.department]||0) + 1; });
    const labels = Object.keys(counts), data = Object.values(counts);
    new Chart(deptCanvas, {
      type:'doughnut',
      data:{ labels, datasets:[{ data, backgroundColor:['#ff6a00','#10b981','#3b82f6','#a855f7','#f59e0b','#ef4444','#06b6d4','#ec4899'], borderColor:'#131316', borderWidth:2 }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ labels:{ color:'#8a8a93', font:{size:11} } } } }
    });
  }
}

}

function renderYearlyHeatmap(emp, year) {
  // build day grid: 53 weeks x 7 days
  const start = new Date(year, 0, 1);
  const today = new Date();
  let totalP=0, totalA=0, totalL=0, totalOT=0;
  let cellsHTML = '';
  // Build by months
  let monthBlocks = [];
  for (let m=0; m<12; m++) {
    const daysInMonth = new Date(year, m+1, 0).getDate();
    let mP=0;
    let monthCells = '';
    for (let d=1; d<=daysInMonth; d++) {
      const ds = `${year}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dt = new Date(year, m, d);
      const wknd = isWeekend(dt);
      const fut = dt > today;
      const att = S.attendance.find(a => a.employeeId === emp.id && a.date === ds);
      const lv = S.leaves.find(l => l.employeeId === emp.id && l.status === 'approved' && inRange(ds, l.fromDate, l.toDate));
      const hol = S.holidays.find(h => h.date === ds);
      let cls = 'y-w';
      let ttl = ds;
      if (fut) cls = 'y-w';
      else if (att) {
        const hrs = (att.workedMinutes||0) / 60;
        cls = hrs >= 8 ? 'y-3' : hrs >= 6 ? 'y-2' : 'y-1';
        ttl = `${ds} · ${fmtDur(att.workedMinutes||0)}`;
        totalP++; mP++; totalOT += (att.overtimeMinutes||0);
      }
      else if (lv) { cls='y-l'; ttl = `${ds} · ${lv.type} leave`; totalL++; }
      else if (hol) { cls='y-h'; ttl = `${ds} · ${hol.name}`; }
      else if (wknd) cls = 'y-w';
      else { cls = 'y-a'; totalA++; ttl = `${ds} · Absent`; }
      monthCells += `<div class="yearly-cell ${cls}" title="${ttl}"></div>`;
    }
    monthBlocks.push(`<div class="flex-shrink-0">
      <div class="text-xs text-[var(--muted)] mb-2 mono">${shortMonth(m)} <span class="text-[var(--green)]">${mP}</span></div>
      <div class="grid gap-1" style="grid-template-columns:repeat(7, 14px); width:fit-content">${monthCells}</div>
    </div>`);
  }
  return `
    <div class="card">
      <div class="flex justify-between items-start mb-4 flex-wrap gap-3">
        <div class="flex items-center gap-3">
          <div class="avatar">${emp.name[0]}</div>
          <div><div class="font-bold">${emp.name}</div><div class="text-xs text-[var(--muted)]">${emp.department} · ${emp.employeeCode||'—'}</div></div>
        </div>
        <div class="flex gap-4 text-sm">
          <div><span class="text-[var(--muted)]">Present:</span> <span class="font-bold text-[var(--green)]">${totalP}</span></div>
          <div><span class="text-[var(--muted)]">Absent:</span> <span class="font-bold text-[var(--red)]">${totalA}</span></div>
          <div><span class="text-[var(--muted)]">Leaves:</span> <span class="font-bold text-[var(--yellow)]">${totalL}</span></div>
          <div><span class="text-[var(--muted)]">OT:</span> <span class="font-bold text-[var(--orange)]">${fmtDur(totalOT)}</span></div>
        </div>
      </div>
      <div class="overflow-x-auto">
        <div class="flex gap-3" style="min-width:fit-content;">${monthBlocks.join('')}</div>
      </div>
    </div>`;
}

function aPayroll() {

    const calc = calcPayroll(e, m, y);

function calcPayroll(emp, month, year) {
  const sal = emp.salary || { basic:0, hra:0, allowances:0, total:0 };
  const workingDays = workingDaysIn(year, month, S.holidays, S.config.workingDays >= 6 ? 1 : 2);
  const perDay = workingDays > 0 ? sal.total / workingDays : 0;
  const perHour = (sal.total / workingDays) / 8;

  const monthAtt = S.attendance.filter(a => a.employeeId === emp.id && a.date.startsWith(`${year}-${String(month+1).padStart(2,'0')}`));
  const monthLeaves = S.leaves.filter(l => l.employeeId === emp.id && l.status === 'approved' && (l.fromDate.startsWith(`${year}-${String(month+1).padStart(2,'0')}`) || l.toDate.startsWith(`${year}-${String(month+1).padStart(2,'0')}`)));
  
  const presentDays = monthAtt.length;
  const totalLateMin = monthAtt.reduce((s,a) => s + (a.lateMinutes||0), 0);
  const totalOTMin = monthAtt.reduce((s,a) => s + (a.overtimeMinutes||0), 0);

  // Calculate leave days (split into paid/unpaid)
  let paidLeaveDays = 0, lopDays = 0;
  monthLeaves.forEach(l => {
    const days = daysBetween(l.fromDate, l.toDate) * (l.halfDay ? 0.5 : 1);
    const ltype = S.leaveTypes.find(t => t.id === l.type);
    if (ltype && ltype.paid) paidLeaveDays += days; else lopDays += days;
  });

  // Loss of pay deduction
  const lopDeduction = Math.round(perDay * lopDays);
  // Late deduction: if total late > 30 min in month, deduct (after grace, configurable)
  const lateDeduction = totalLateMin > 60 ? Math.round((totalLateMin/60) * perHour * 0.5) : 0;
  // OT bonus
  const otBonus = Math.round((totalOTMin/60) * perHour * (S.config.otRate || 1.5));
  // PF deduction (12% of basic, simplified)
  const pf = Math.round(sal.basic * 0.12);

  const earnings = {
    basic: sal.basic, hra: sal.hra, allowances: sal.allowances, otBonus,
    total: sal.basic + sal.hra + sal.allowances + otBonus
  };
  const deductions = {
    pf, lop: lopDeduction, late: lateDeduction,
    total: pf + lopDeduction + lateDeduction
  };
  const netSalary = earnings.total - deductions.total;

  return { emp, month, year, workingDays, presentDays, paidLeaveDays, lopDays, totalLateMin, totalOTMin, earnings, deductions, netSalary };
}

function drawReports() {
  const ym = new Date().getFullYear() + '-' + String(new Date().getMonth()+1).padStart(2,'0');
  
  // Monthly trend (last 6 months)
  const mt = document.getElementById('monthlyTrend');
  if (mt) {
    const labels=[], pres=[], lates=[];
    for (let i=5; i>=0; i--) {
      const d = new Date(); d.setMonth(d.getMonth()-i);
      const ym = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      labels.push(shortMonth(d.getMonth()));
      const monthAtt = S.attendance.filter(a => a.date.startsWith(ym));
      pres.push(monthAtt.length);
      lates.push(monthAtt.filter(a => a.lateMinutes>0).length);
    }
    new Chart(mt, { type:'line', data:{ labels, datasets:[
      { label:'Total Present', data:pres, borderColor:'#10b981', backgroundColor:'rgba(16,185,129,.1)', tension:.3, fill:true },
      { label:'Late Arrivals', data:lates, borderColor:'#ef4444', backgroundColor:'rgba(239,68,68,.1)', tension:.3, fill:true }
    ]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:'#8a8a93'}}}, scales:{x:{ticks:{color:'#8a8a93'},grid:{display:false}},y:{ticks:{color:'#8a8a93'},grid:{color:'#26262d'}}}}});
  }
  
  // OT by department
  const otD = document.getElementById('otDept');
  if (otD) {
    const deptOT = {};
    S.attendance.filter(a => a.date.startsWith(ym)).forEach(a => {
      const e = S.employees.find(x => x.id === a.employeeId);
      if (e) { deptOT[e.department] = (deptOT[e.department]||0) + (a.overtimeMinutes||0); }
    });
    new Chart(otD, { type:'bar', data:{ labels:Object.keys(deptOT), datasets:[{ label:'OT Minutes', data:Object.values(deptOT), backgroundColor:'rgba(255,106,0,.7)', borderRadius:6 }]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{ticks:{color:'#8a8a93'},grid:{display:false}},y:{ticks:{color:'#8a8a93'},grid:{color:'#26262d'}}}}});
  }
  
  // Late chart
  const lc = document.getElementById('lateChart');
  if (lc) {
    const empLate = {};
    S.attendance.filter(a => a.date.startsWith(ym) && a.lateMinutes>0).forEach(a => {
      empLate[a.employeeId] = (empLate[a.employeeId]||0) + a.lateMinutes;
    });
    const top5 = Object.entries(empLate).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const labels = top5.map(([id]) => S.employees.find(e=>e.id===id)?.name?.split(' ')[0] || '?');
    const data = top5.map(([,m]) => m);
    new Chart(lc, { type:'bar', data:{ labels, datasets:[{ label:'Late Minutes', data, backgroundColor:'rgba(239,68,68,.7)', borderRadius:6 }]},
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{ticks:{color:'#8a8a93'},grid:{color:'#26262d'}},y:{ticks:{color:'#8a8a93'},grid:{display:false}}}}});
  }
  
  // Leave type pie
  const lt = document.getElementById('leaveTypeChart');
  if (lt) {
    const counts = {};
    S.leaves.filter(l => l.status==='approved').forEach(l => { counts[l.type] = (counts[l.type]||0) + 1; });
    if (Object.keys(counts).length === 0) counts['No data'] = 1;
    new Chart(lt, { type:'doughnut', data:{ labels:Object.keys(counts), datasets:[{ data:Object.values(counts), backgroundColor:['#f59e0b','#ef4444','#10b981','#8a8a93'], borderColor:'#131316', borderWidth:2 }]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:'#8a8a93'}}} } });
  }
}

          <button id="saveCfg" class="btn btn-primary w-full justify-center mt-2">Save Working Hours</button>

          <div class="flex justify-between mb-1"><span class="text-sm font-semibold">Overtime Window</span><span class="badge badge-orange">${c.officeOut}–${c.overtimeCap}</span></div>

function vEmp() {
  const tabs = [
    ['dashboard','Dashboard'],
    ['scan','Scan'],
    ['attendance','My Attendance'],
    ['yearly','Yearly View'],
    ['leave','Leaves'],
    ['regularization','Regularize'],
    ['payslip','Payslip'],
    ['profile','Profile'],
    ['notices','Notices'],
  ];
  const e = S.user;
  return `<div class="min-h-screen">
    <header class="border-b border-[var(--border)] bg-[var(--panel)] px-6 py-3 flex justify-between items-center flex-wrap gap-3 sticky top-0 z-10">
      <div class="flex items-center gap-3">
        <div class="avatar">${e.name[0]}</div>
        <div><div class="font-bold text-sm">${e.name}</div><div class="text-xs text-[var(--muted)]">${e.department} · ${e.employeeCode||'—'}</div></div>
      </div>
      <div class="flex items-center gap-1 flex-wrap">
        ${tabs.map(([id,lbl]) => `<button class="btn ${S.empTab===id?'btn-primary':'btn-ghost'} text-xs empTab" data-tab="${id}">${lbl}</button>`).join('')}

function eRoute() {
  switch(S.empTab) {
    case 'dashboard': return eDashboard();
    case 'scan': return eScan();
    case 'attendance': return eAttendance();
    case 'yearly': return eYearly();
    case 'leave': return eLeave();
    case 'regularization': return eRegularize();
    case 'payslip': return ePayslip();
    case 'profile': return eProfile();
    case 'notices': return eNotices();
  }
  return '';
}

function eDashboard() {

  const myLeaves = S.leaves.filter(l => l.employeeId===e.id);
  const myNotices = S.notices.filter(n => !n.forEmployeeId || n.forEmployeeId === e.id).slice().reverse().slice(0,3);
  return `
    <div class="mb-6"><h1 class="text-3xl font-extrabold mb-1">Hello, ${e.name.split(' ')[0]} 👋</h1><p class="text-[var(--muted)]">${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'2-digit',month:'long'})} · Office ${S.config.officeIn}–${S.config.officeOut}</p></div>
    <div class="grid md:grid-cols-4 gap-3 mb-5">
      <div class="stat-card"><div class="text-xs text-[var(--muted)] mb-1">TODAY</div>${todayAtt?`<div class="stat-num text-[var(--green)]">${todayAtt.checkOut?'Done':'In'}</div><div class="text-xs mono mt-1">IN ${todayAtt.checkIn}${todayAtt.checkOut?` · OUT ${todayAtt.checkOut}`:''}</div>${todayAtt.lateMinutes?'<span class="badge badge-red">LATE</span>':''}${todayAtt.overtimeMinutes?'<span class="badge badge-orange">OT</span>':''}`:`<div class="stat-num text-[var(--yellow)]">Not Yet</div><div class="text-xs text-[var(--muted)] mt-1">Scan to check in</div>`}</div>
      <div class="stat-card"><div class="text-xs text-[var(--muted)] mb-1">THIS MONTH</div><div class="stat-num gradient-text">${monthAtt.length}</div><div class="text-xs text-[var(--muted)] mt-1">present days</div></div>
      <div class="stat-card"><div class="text-xs text-[var(--muted)] mb-1">OVERTIME</div><div class="stat-num text-[var(--orange)]">${fmtDur(monthOT)}</div><div class="text-xs text-[var(--muted)] mt-1">this month</div></div>
      <div class="stat-card"><div class="text-xs text-[var(--muted)] mb-1">LEAVE BALANCE</div><div class="stat-num text-[var(--green)]">${(e.leaveBalance?.casual||0) + (e.leaveBalance?.sick||0) + (e.leaveBalance?.earned||0)}</div><div class="text-xs text-[var(--muted)] mt-1">days available</div></div>
    </div>
    <div class="grid md:grid-cols-2 gap-4 mb-5">
      <div class="card hover-lift cursor-pointer" id="qScan">
        <div class="w-14 h-14 rounded-xl flex items-center justify-center mb-3" style="background:linear-gradient(135deg,var(--orange),var(--orange-2));">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h7v7h-7z"/></svg>
        </div>
        <h3 class="font-bold text-lg mb-1">Scan QR for Attendance</h3>
        <p class="text-sm text-[var(--muted)]">Camera open hoga, QR scan karein — time + location auto-record.</p>
      </div>
      <div class="card hover-lift cursor-pointer" id="qLeave">
        <div class="w-14 h-14 rounded-xl flex items-center justify-center mb-3" style="background:rgba(245,158,11,.15);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--yellow)" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        </div>
        <h3 class="font-bold text-lg mb-1">Apply for Leave</h3>
        <p class="text-sm text-[var(--muted)]">Multiple types — Casual, Sick, Earned, LOP. Half-day option bhi.</p>
      </div>
    </div>
    <div class="grid md:grid-cols-2 gap-5">
      <div class="card">
        <h3 class="font-bold mb-3">Leave Balance</h3>

          ${S.leaveTypes.map(t => `<div class="flex justify-between items-center p-2 rounded bg-[var(--panel-2)]">
            <span class="text-sm">${t.name}</span>
            <span class="font-bold text-[var(--${t.color === 'gray' ? 'muted' : t.color})]">${e.leaveBalance?.[t.id]??0} days</span>

function eScan() {

      <div class="mb-5"><h1 class="text-3xl font-extrabold mb-1">Scan Attendance</h1><p class="text-[var(--muted)]">${todayAtt && !todayAtt.checkOut ? 'Checked-in. Scan again to check out.' : todayAtt && todayAtt.checkOut ? 'Aaj done.' : 'Camera + Location allow karein.'}</p></div>
      ${todayAtt ? `<div class="card mb-5">
        <div class="text-xs text-[var(--muted)] mb-3">TODAY'S RECORD</div>
        <div class="grid grid-cols-2 gap-4">
          <div><div class="text-xs text-[var(--muted)]">Check In</div><div class="text-xl font-bold text-[var(--green)] mono">${todayAtt.checkIn}</div>${todayAtt.lateMinutes>0?`<span class="badge badge-red mt-1 inline-block">LATE ${fmtDur(todayAtt.lateMinutes)}</span>`:'<span class="badge badge-green mt-1 inline-block">ON-TIME</span>'}</div>
          <div><div class="text-xs text-[var(--muted)]">Check Out</div><div class="text-xl font-bold ${todayAtt.checkOut?'text-[var(--red)]':'text-[var(--muted)]'} mono">${todayAtt.checkOut||'—'}</div>${todayAtt.overtimeMinutes>0?`<span class="badge badge-orange mt-1 inline-block">OT ${fmtDur(todayAtt.overtimeMinutes)}</span>`:todayAtt.checkOut?'<span class="badge badge-green mt-1 inline-block">ON-TIME</span>':''}</div>
        </div>
        ${todayAtt.workedMinutes>0?`<div class="mt-3 pt-3 border-t border-[var(--border)] text-sm">Worked: <span class="font-bold mono text-[var(--orange)]">${fmtDur(todayAtt.workedMinutes)}</span></div>`:''}
        ${todayAtt.location?`<div class="mt-2 text-xs text-[var(--muted)]">📍 ${todayAtt.location.label || `${todayAtt.location.lat?.toFixed(4)}, ${todayAtt.location.lng?.toFixed(4)}`}</div>`:''}
      </div>`:''}
      ${todayAtt && todayAtt.checkOut ? '' : `
        <div class="card scan-frame">
          ${S.scanning?`<div id="qrReader" class="w-full"></div><button id="stopScan" class="btn btn-danger w-full justify-center mt-4">Stop</button>`:`
            <div class="text-center py-10">
              <div class="w-24 h-24 mx-auto rounded-2xl flex items-center justify-center mb-5" style="background:rgba(255,106,0,.1);">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h7v7h-7z"/></svg>
              </div>
              <button id="startScan" class="btn btn-primary text-lg">📷 Open Camera & Scan</button>
              <p class="text-xs text-[var(--muted)] mt-3">Camera + Location permission allow karein</p>
            </div>`}
          <div id="scanMsg" class="mt-3 text-sm text-center"></div>
        </div>`}
    </div>`;
}

function eAttendance() {
  const e = S.user, m = S.selMonth, y = S.selYear;
  const days = new Date(y, m+1, 0).getDate();
  const myAtt = S.attendance.filter(a => a.employeeId===e.id);
  const tdy = new Date();
  let p=0, a=0, l=0, totalWorked=0, totalOT=0;
  const cells = [];
  for (let i=0; i<new Date(y,m,1).getDay(); i++) cells.push('<div></div>');
  for (let d=1; d<=days; d++) {
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dt = new Date(y, m, d);
    const wknd = isWeekend(dt);
    const fut = dt > tdy;
    const att = myAtt.find(x => x.date === ds);
    const lv = S.leaves.find(x => x.employeeId===e.id && x.status==='approved' && inRange(ds, x.fromDate, x.toDate));
    const hol = S.holidays.find(h => h.date===ds);
    let cls, ttl=ds;
    if (fut) cls = 'future';
    else if (att) { cls = att.mode==='wfh'?'wfh':'present'; p++; totalWorked+=(att.workedMinutes||0); totalOT+=(att.overtimeMinutes||0); ttl = `${ds}\nIN ${att.checkIn}${att.checkOut?` OUT ${att.checkOut}`:''}\nWorked: ${fmtDur(att.workedMinutes||0)}${att.overtimeMinutes?` OT: ${fmtDur(att.overtimeMinutes)}`:''}`; }
    else if (lv) { cls='leave'; l++; ttl = `${ds} · ${lv.type} leave`; }
    else if (hol) { cls='holiday'; ttl = `${ds} · ${hol.name}`; }
    else if (wknd) cls = 'weekend';
    else { cls = 'absent'; a++; }
    cells.push(`<div class="grid-cell ${cls}" style="font-size:14px;" title="${ttl}">${d}</div>`);
  }
  return `
    <div class="mb-5 flex justify-between items-end flex-wrap gap-3">
      <div><h1 class="text-3xl font-extrabold mb-1">My Attendance</h1><p class="text-[var(--muted)]">${monthName(m)} ${y}</p></div>
      <div class="flex gap-2">
        <select id="mSel" class="select" style="width:150px">${Array.from({length:12},(_,i)=>`<option value="${i}" ${i===m?'selected':''}>${monthName(i)}</option>`).join('')}</select>
        <select id="ySel" class="select" style="width:110px">${Array.from({length:5},(_,i)=>y-2+i).map(yr=>`<option value="${yr}" ${yr===y?'selected':''}>${yr}</option>`).join('')}</select>
      </div>
    </div>
    <div class="grid md:grid-cols-4 gap-3 mb-5">
      <div class="stat-card"><div class="text-xs text-[var(--muted)] mb-1">PRESENT</div><div class="stat-num text-[var(--green)]">${p}</div></div>
      <div class="stat-card"><div class="text-xs text-[var(--muted)] mb-1">ABSENT</div><div class="stat-num text-[var(--red)]">${a}</div></div>
      <div class="stat-card"><div class="text-xs text-[var(--muted)] mb-1">LEAVES</div><div class="stat-num text-[var(--yellow)]">${l}</div></div>
      <div class="stat-card"><div class="text-xs text-[var(--muted)] mb-1">TOTAL WORK</div><div class="stat-num text-[var(--orange)]">${Math.round(totalWorked/60)}h</div><div class="text-xs text-[var(--muted)] mt-1">OT: ${fmtDur(totalOT)}</div></div>
    </div>
    <div class="card mb-5">
      <div class="grid grid-cols-7 gap-2 mb-2 text-center text-xs text-[var(--muted)] font-semibold">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div>${d}</div>`).join('')}</div>
      <div class="grid grid-cols-7 gap-2">${cells.join('')}</div>
    </div>
    <div class="card">
      <h3 class="font-bold mb-3">Detailed Records</h3>
      <div class="overflow-x-auto">
        <table>
          <thead><tr><th>Date</th><th>IN</th><th>OUT</th><th>Worked</th><th>Late</th><th>OT</th><th>Location</th></tr></thead>
          <tbody>
            ${myAtt.filter(x=>x.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)).slice().reverse().map(x => `<tr>
              <td>${fmtDate(x.date)}</td>
              <td class="mono text-[var(--green)]">${x.checkIn}</td>
              <td class="mono ${x.checkOut?'text-[var(--red)]':'text-[var(--muted)]'}">${x.checkOut||'—'}</td>
              <td class="mono">${fmtDur(x.workedMinutes||0)}</td>
              <td class="mono ${x.lateMinutes>0?'text-[var(--red)]':'text-[var(--muted)]'}">${x.lateMinutes?fmtDur(x.lateMinutes):'—'}</td>
              <td class="mono ${x.overtimeMinutes>0?'text-[var(--orange)] font-bold':'text-[var(--muted)]'}">${x.overtimeMinutes?fmtDur(x.overtimeMinutes):'—'}</td>
              <td class="text-xs text-[var(--muted)]">${x.location?.label?.substring(0,35) || '—'}</td>
            </tr>`).join('') || '<tr><td colspan="7" class="text-center text-[var(--muted)] py-6">Is month ka koi record nahi.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>`;
}

            <div class="p-3 rounded bg-[var(--panel-2)]">

function modalSlip() {
  const emp = S.employees.find(x => x.id === S.modal.emp);
  if (!emp) return '';
  // Prefer stored payroll record over recalc (so historical accuracy preserved)
  const p = S.modal.payrollData || S.payroll.find(x => x.employeeId === S.modal.emp && x.month === S.modal.m && x.year === S.modal.y) || { ...calcPayroll(emp, S.modal.m, S.modal.y), employeeId: emp.id, month: S.modal.m, year: S.modal.y };
  // Make sure emp is available for renderPayslip (it expects p.emp)
  if (!p.emp) p.emp = emp;
  return `<div class="modal-bg" id="modalBg"><div class="modal modal-lg" onclick="event.stopPropagation()">
    <div class="flex justify-between mb-3 no-print">
      <h3 class="text-xl font-bold">Salary Slip · ${monthName(p.month)} ${p.year} ${p.status==='paid'?'<span class="badge badge-green ml-2">PAID</span>':''}</h3>

        <button id="vClose" class="btn btn-ghost">×</button>
      </div>
    </div>
    ${renderPayslip(p)}
  </div></div>`;
}

// ==================== HANDLERS ====================
function attachHandlers() {
  // Landing
  document.getElementById('goAdmin')?.addEventListener('click', () => { S.view='adminLogin'; render(); });
  document.getElementById('goEmp')?.addEventListener('click', () => { window.location.href = '/employee-login.html'; });
  document.getElementById('backHome')?.addEventListener('click', () => { S.view='landing'; render(); });
  
  // Admin login
  document.getElementById('aSubmit')?.addEventListener('click', async () => {
    const u = document.getElementById('aU').value.trim(), p = document.getElementById('aP').value;
    try {
      const result = await API.post('/api/auth/admin-login', { username: u, password: p });
      API.setToken(result.token);
      S.user = result.user; S.role = 'admin'; S.view = 'admin';
      await init();
      render();
    } catch (e) {
      document.getElementById('aErr').textContent = e.message;
    }
  });
  document.getElementById('aU')?.addEventListener('keypress', e => { if (e.key==='Enter') document.getElementById('aP').focus(); });
  document.getElementById('aP')?.addEventListener('keypress', e => { if (e.key==='Enter') document.getElementById('aSubmit').click(); });
  
  // Emp login
  document.getElementById('eSubmit')?.addEventListener('click', async () => {
    const em = document.getElementById('eE').value.trim().toLowerCase(), p = document.getElementById('eP').value;
    try {
      const result = await API.post('/api/auth/employee-login', { email: em, password: p });
      API.setToken(result.token);
      S.user = result.user; S.role = 'employee'; S.view = 'employee';
      await init();
      render();
    } catch (e) {
      document.getElementById('eErr').textContent = e.message;
    }
  });
  document.getElementById('eE')?.addEventListener('keypress', e => { if (e.key==='Enter') document.getElementById('eP').focus(); });
  document.getElementById('eP')?.addEventListener('keypress', e => { if (e.key==='Enter') document.getElementById('eSubmit').click(); });
  
  // Sidebar/tab
  document.querySelectorAll('[data-tab]').forEach(el => el.addEventListener('click', () => { 
    if (S.role === 'admin') S.adminTab = el.dataset.tab; 
    else S.empTab = el.dataset.tab;
    if (S.scanner) stopScanner();
    render(); 
  }));
  document.querySelectorAll('.empTab').forEach(el => el.addEventListener('click', () => {
    S.empTab = el.dataset.tab;
    if (S.scanner) stopScanner();
    render();
  }));
  document.getElementById('aLogout')?.addEventListener('click', logout);
  document.getElementById('eLogout')?.addEventListener('click', logout);
  
  // QR
  document.getElementById('refreshQR')?.addEventListener('click', async () => {
    S.todayQR = await API.post('/api/qr/refresh');
    render();
  });
  document.getElementById('dlQR')?.addEventListener('click', () => {
    const img = document.querySelector('#qrcode img'); if (!img) return;
    const a = document.createElement('a'); a.href = img.src; a.download = `qr-${today()}.png`; a.click();
  });
  document.getElementById('printQR')?.addEventListener('click', () => {
    const img = document.querySelector('#qrcode img'); if (!img) return;
    const w = window.open(); w.document.write(`<html><body style="text-align:center;padding:40px;font-family:sans-serif"><h2>Editone International — Attendance QR</h2><p>${today()}</p>${img.outerHTML}<p style="margin-top:20px;font-size:11px">${S.todayQR.code}</p></body></html>`); w.print();
  });
  
  // Employees
  document.getElementById('empSearch')?.addEventListener('input', e => { S.search = e.target.value; aRefresh('employees'); });
  document.getElementById('addEmp')?.addEventListener('click', () => { S.modal = { type:'employee', data:{} }; render(); });
  document.querySelectorAll('.editEmp').forEach(b => b.addEventListener('click', () => {
    const e = S.employees.find(x => x.id === b.dataset.id);
    S.modal = { type:'employee', data: { ...e } }; render();
  }));
  document.querySelectorAll('.viewEmp').forEach(b => b.addEventListener('click', () => { S.modal = { type:'viewEmp', id: b.dataset.id }; render(); }));
  document.querySelectorAll('.delEmp').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Delete karna hai?')) return;
    await API.del('/api/employees/' + b.dataset.id);
    await refreshData();
  }));
  document.getElementById('empCancel')?.addEventListener('click', () => { S.modal = null; render(); });
  document.getElementById('modalBg')?.addEventListener('click', () => { S.modal = null; render(); });
  document.getElementById('vClose')?.addEventListener('click', () => { S.modal = null; render(); });
  document.getElementById('empSave')?.addEventListener('click', async () => {
    const data = {
      employeeCode: document.getElementById('f_code').value.trim(),
      name: document.getElementById('f_name').value.trim(),
      email: document.getElementById('f_email').value.trim(),
      phone: document.getElementById('f_phone').value.trim(),
      department: document.getElementById('f_dept').value,
      designation: document.getElementById('f_desig').value.trim(),
      joinDate: document.getElementById('f_join').value,
      dob: document.getElementById('f_dob').value,
      gender: document.getElementById('f_gender').value,
      password: document.getElementById('f_pass').value,
      address: document.getElementById('f_addr').value.trim(),
      emergency: {
        name: document.getElementById('f_emName').value.trim(),
        phone: document.getElementById('f_emPhone').value.trim(),
        relation: document.getElementById('f_emRel').value.trim(),
      },
      salary: {
        basic: +document.getElementById('f_basic').value || 0,
        hra: +document.getElementById('f_hra').value || 0,
        allowances: +document.getElementById('f_allow').value || 0,
      },
      status: 'active',
    };
    if (!data.name || !data.email || (!S.modal.data.id && !data.password)) { 
      document.getElementById('empFErr').textContent = 'Name, email aur password mandatory.'; return; 
    }
    try {
      if (S.modal.data.id) {
        await API.put('/api/employees/' + S.modal.data.id, data);
      } else {
        await API.post('/api/employees', data);
      }
      S.modal = null;
      await refreshData();
    } catch (e) {
      document.getElementById('empFErr').textContent = e.message;
    }
  });
  document.getElementById('exportEmp')?.addEventListener('click', () => exportCSV('employees.csv', S.employees, ['employeeCode','name','email','phone','department','designation','joinDate','status']));
  
  // Departments
  document.getElementById('addDept')?.addEventListener('click', () => { S.modal = { type:'department', data:{} }; render(); });
  document.querySelectorAll('.editDept').forEach(b => b.addEventListener('click', () => {
    const d = S.departments.find(x => x.id === b.dataset.id); S.modal = { type:'department', data:{...d} }; render();
  }));
  document.querySelectorAll('.delDept').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Delete department?')) return;
    await API.del('/api/departments/' + b.dataset.id);
    await refreshData();
  }));
  document.getElementById('deptCancel')?.addEventListener('click', () => { S.modal = null; render(); });
  document.getElementById('deptSave')?.addEventListener('click', async () => {
    const data = { name: document.getElementById('d_name').value.trim(), head: document.getElementById('d_head').value.trim() };
    if (!data.name) return;
    if (S.modal.data.id) await API.put('/api/departments/' + S.modal.data.id, data);
    else await API.post('/api/departments', data);
    S.modal = null;
    await refreshData();
  });
  
  // Month/year selectors
  document.getElementById('mSel')?.addEventListener('change', e => { S.selMonth = +e.target.value; render(); });
  document.getElementById('ySel')?.addEventListener('change', e => { S.selYear = +e.target.value; render(); });
  document.getElementById('exportAtt')?.addEventListener('click', () => exportAttendanceCSV());
  document.getElementById('payrollCSV')?.addEventListener('click', () => exportPayrollCSV());
  
  // Leaves admin
  document.querySelectorAll('.approveLv').forEach(b => b.addEventListener('click', async () => {
    await API.put('/api/leaves/' + b.dataset.id + '/decision', { status: 'approved' });
    await refreshData();
  }));
  document.querySelectorAll('.rejectLv').forEach(b => b.addEventListener('click', async () => {
    await API.put('/api/leaves/' + b.dataset.id + '/decision', { status: 'rejected' });
    await refreshData();
  }));
  
  // Regularization admin
  document.querySelectorAll('.approveReg').forEach(b => b.addEventListener('click', async () => {
    await API.put('/api/regularizations/' + b.dataset.id + '/decision', { status: 'approved' });
    await refreshData();
  }));
  document.querySelectorAll('.rejectReg').forEach(b => b.addEventListener('click', async () => {
    await API.put('/api/regularizations/' + b.dataset.id + '/decision', { status: 'rejected' });
    await refreshData();
  }));
  
  // Holidays
  document.getElementById('addHoliday')?.addEventListener('click', () => { S.modal = { type:'holiday', data:{} }; render(); });
  document.querySelectorAll('.delHol').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Delete holiday?')) return;
    await API.del('/api/holidays/' + b.dataset.id);
    await refreshData();
  }));
  document.getElementById('holCancel')?.addEventListener('click', () => { S.modal = null; render(); });
  document.getElementById('holSave')?.addEventListener('click', async () => {
    const name = document.getElementById('h_name').value.trim();
    const date = document.getElementById('h_date').value;
    const type = document.getElementById('h_type').value;
    if (!name || !date) return;
    await API.post('/api/holidays', { name, date, type });
    S.modal = null;
    await refreshData();
  });
  
  // Notices
  document.getElementById('addNotice')?.addEventListener('click', () => { S.modal = { type:'notice' }; render(); });
  document.querySelectorAll('.delNotice').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Delete notice?')) return;
    await API.del('/api/notices/' + b.dataset.id);
    await refreshData();
  }));
  document.getElementById('noticeCancel')?.addEventListener('click', () => { S.modal = null; render(); });
  document.getElementById('noticeSave')?.addEventListener('click', async () => {
    const title = document.getElementById('n_title').value.trim();
    const body = document.getElementById('n_body').value.trim();
    const priority = document.getElementById('n_pri').value;
    if (!title || !body) return;
    await API.post('/api/notices', { title, body, priority });
    S.modal = null;
    await refreshData();
  });
  
  // Settings
  document.getElementById('saveCfg')?.addEventListener('click', async () => {
    const c = {
      ...S.config,
      officeIn: document.getElementById('cIn').value,
      officeOut: document.getElementById('cOut').value,
      overtimeCap: document.getElementById('cCap').value,
      gracePeriod: +document.getElementById('cGrace').value || 0,
      workingDays: +document.getElementById('cWD').value,
      otRate: +document.getElementById('cOTR').value || 1.5,
    };
    const msg = document.getElementById('cfgMsg');
    if (timeToMin(c.officeIn) >= timeToMin(c.officeOut)) { msg.innerHTML = '<span style="color:var(--red)">Office Out, In ke baad chahiye</span>'; return; }
    if (timeToMin(c.overtimeCap) <= timeToMin(c.officeOut)) { msg.innerHTML = '<span style="color:var(--red)">OT Cap, Out ke baad chahiye</span>'; return; }
    await API.put('/api/config', c);
    S.config = c;
    msg.innerHTML = '<span style="color:var(--green)">✓ Saved!</span>';
    setTimeout(() => render(), 800);
  });
  
  // Reports exports
  document.getElementById('expEmp')?.addEventListener('click', () => exportCSV('employees.csv', S.employees, ['employeeCode','name','email','phone','department','designation','joinDate','status']));
  document.getElementById('expAtt')?.addEventListener('click', () => exportAttendanceCSV(true));
  document.getElementById('expLv')?.addEventListener('click', () => exportCSV('leaves.csv', S.leaves.map(l => ({...l, employeeName: S.employees.find(e=>e.id===l.employeeId)?.name})), ['employeeName','type','fromDate','toDate','status','reason']));
  document.getElementById('expPay')?.addEventListener('click', () => exportPayrollCSV());

  document.querySelectorAll('.viewSlip').forEach(b => b.addEventListener('click', () => { 
    S.modal = { type:'slip', emp: b.dataset.emp, m: +b.dataset.m, y: +b.dataset.y };
    render();
  }));
  
  // EMPLOYEE handlers
  document.getElementById('qScan')?.addEventListener('click', () => { S.empTab = 'scan'; render(); });
  document.getElementById('qLeave')?.addEventListener('click', () => { S.empTab = 'leave'; render(); });
  document.getElementById('startScan')?.addEventListener('click', startScanner);
  document.getElementById('stopScan')?.addEventListener('click', stopScanner);
  
  document.getElementById('submitLv')?.addEventListener('click', async () => {

    const to = document.getElementById('lvTo').value;
    const halfDay = document.getElementById('lvHalf').checked;
    const reason = document.getElementById('lvReason').value.trim();
    const msg = document.getElementById('lvMsg');
    if (!from || !to || !reason) { msg.innerHTML = '<span style="color:var(--red)">All fields required</span>'; return; }
    if (to < from) { msg.innerHTML = '<span style="color:var(--red)">To date should be after From</span>'; return; }
    try {
      await API.post('/api/leaves', { type, fromDate: from, toDate: to, halfDay, reason });
      msg.innerHTML = '<span style="color:var(--green)">✓ Submitted! Admin approval ka wait karein.</span>';
      await refreshData();
    } catch (e) { msg.innerHTML = `<span style="color:var(--red)">${e.message}</span>`; }
  });
  
  document.getElementById('submitReg')?.addEventListener('click', async () => {
    const date = document.getElementById('regDate').value;
    const checkIn = document.getElementById('regIn').value;
    const checkOut = document.getElementById('regOut').value;
    const reason = document.getElementById('regReason').value.trim();
    const msg = document.getElementById('regMsg');
    if (!date || !reason || (!checkIn && !checkOut)) { msg.innerHTML = '<span style="color:var(--red)">Date, reason, aur kam-se-kam ek time chahiye</span>'; return; }
    try {
      await API.post('/api/regularizations', { date, checkIn, checkOut, reason });
      msg.innerHTML = '<span style="color:var(--green)">✓ Submitted!</span>';
      await refreshData();
    } catch (e) { msg.innerHTML = `<span style="color:var(--red)">${e.message}</span>`; }
  });
  
  document.getElementById('editProfile')?.addEventListener('click', () => { S.modal = { type:'editProfile' }; render(); });
  document.getElementById('profileCancel')?.addEventListener('click', () => { S.modal = null; render(); });
  document.getElementById('profileSave')?.addEventListener('click', async () => {
    const data = {
      phone: document.getElementById('ep_phone').value.trim(),
      address: document.getElementById('ep_addr').value.trim(),
      emergency: {
        name: document.getElementById('ep_emName').value.trim(),
        phone: document.getElementById('ep_emPhone').value.trim(),
        relation: document.getElementById('ep_emRel').value.trim(),
      },
    };
    const newPass = document.getElementById('ep_pass').value;
    if (newPass) data.password = newPass;
    await API.put('/api/employees/' + S.user.id, data);
    S.modal = null;
    // Refresh user data
    S.user = await API.get('/api/auth/me');
    render();
  });

  // Attach all extra handlers for new features
  attachExtraHandlers();
}

function aRefresh(tab) { S.adminTab = tab; render(); }

  S.viewEmpId = id;
  S.viewEmpTab = 'overview';
  render();
}

function attachExtraHandlers() {
  // Open employee detail on row click
  document.querySelectorAll('.openEmp').forEach(el => el.addEventListener('click', () => openEmployee(el.dataset.id)));
  document.getElementById('backEmpList')?.addEventListener('click', () => { S.viewEmpId = null; render(); });
  document.querySelectorAll('.empDtlTab').forEach(b => b.addEventListener('click', () => { S.viewEmpTab = b.dataset.tab; render(); }));
  
  // Process payroll from employee detail
  document.getElementById('empProcessPay')?.addEventListener('click', () => { 
    S.modal = { type:'processPayroll', empId: S.viewEmpId, m: S.selMonth, y: S.selYear }; render(); 
  });
  document.getElementById('empProcessPay2')?.addEventListener('click', () => { 
    S.modal = { type:'processPayroll', empId: S.viewEmpId, m: S.selMonth, y: S.selYear }; render(); 
  });
  
  // Process payroll from payroll list
  document.querySelectorAll('.processPay').forEach(b => b.addEventListener('click', () => {
    S.modal = { type:'processPayroll', empId: b.dataset.emp, m: +b.dataset.m, y: +b.dataset.y };
    render();
  }));
  
  // Confirm process payroll
  document.getElementById('confirmProcess')?.addEventListener('click', async () => {
    try {
      await API.post('/api/payroll/process', { employeeId: S.modal.empId, month: S.modal.m, year: S.modal.y });
      const emp = S.employees.find(e => e.id === S.modal.empId) || S.user;
      alert(`✓ Payslip generated for ${emp.name} · ${monthName(S.modal.m)} ${S.modal.y}`);
      S.modal = null;
      await refreshData();
    } catch (e) { alert('Error: ' + e.message); }
  });
  document.getElementById('cancelProcess')?.addEventListener('click', () => { S.modal = null; render(); });
  
  // Process all employees for selected month
  document.getElementById('processAllPay')?.addEventListener('click', async () => {
    if (!confirm(`Sab employees ka ${monthName(S.selMonth)} ${S.selYear} payroll process karna hai?`)) return;
    let count = 0, errs = 0;
    for (const emp of S.employees.filter(e => e.status === 'active')) {
      try {
        await API.post('/api/payroll/process', { employeeId: emp.id, month: S.selMonth, year: S.selYear });
        count++;
      } catch (e) { errs++; }
    }
    alert(`✓ ${count} processed${errs?`, ${errs} errors`:''}.`);
    await refreshData();
  });
  
  // Mark paid
  document.querySelectorAll('.markPaid').forEach(b => b.addEventListener('click', () => {
    S.modal = { type:'markPaid', payrollId: b.dataset.pid };
    render();
  }));
  document.getElementById('cancelPay')?.addEventListener('click', () => { S.modal = null; render(); });
  document.getElementById('confirmPay')?.addEventListener('click', async () => {
    try {
      await API.put('/api/payroll/' + S.modal.payrollId + '/pay', {
        paidAt: document.getElementById('pay_date').value,
        paymentMode: document.getElementById('pay_mode').value,
        transactionId: document.getElementById('pay_txn').value.trim(),
        paymentRemarks: document.getElementById('pay_remarks').value.trim(),
      });
      const p = S.payroll.find(x => x.id === S.modal.payrollId);
      const emp = S.employees.find(e => e.id === p?.employeeId);
      alert(`✓ Payment marked${emp ? ` for ${emp.name}` : ''}\nEmployee ko notification mil gayi hai.`);
      S.modal = null;
      await refreshData();
    } catch (e) { alert('Error: ' + e.message); }
  });
  
  // Delete payroll
  document.querySelectorAll('.delPay').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Payroll record delete karna hai?')) return;
    await API.del('/api/payroll/' + b.dataset.pid);
    await refreshData();
  }));
  
  // View slip from history
  document.querySelectorAll('.viewSlip2').forEach(b => b.addEventListener('click', () => {
    const p = S.payroll.find(x => x.id === b.dataset.pid);
    if (!p) return;
    S.modal = { type:'slip', emp: p.employeeId, m: p.month, y: p.year, payrollData: p };
    render();
  }));
  
  // Employee slip card click
  document.querySelectorAll('.slipCard').forEach(el => el.addEventListener('click', () => { S.viewingSlipId = el.dataset.id; render(); }));
  
  // Office location
  document.getElementById('useCurrentLoc')?.addEventListener('click', () => {
    const msg = document.getElementById('officeMsg');
    msg.innerHTML = '<span style="color:var(--muted)">📍 Getting location...</span>';
    navigator.geolocation.getCurrentPosition(pos => {
      document.getElementById('cOLat').value = pos.coords.latitude.toFixed(6);
      document.getElementById('cOLng').value = pos.coords.longitude.toFixed(6);
      msg.innerHTML = '<span style="color:var(--green)">✓ Location captured. Click Save.</span>';
    }, err => {
      msg.innerHTML = `<span style="color:var(--red)">Error: ${err.message}</span>`;
    });
  });
  document.getElementById('saveOffice')?.addEventListener('click', async () => {
    S.config.officeName = document.getElementById('cOName').value.trim();
    S.config.officeLat = +document.getElementById('cOLat').value || null;
    S.config.officeLng = +document.getElementById('cOLng').value || null;
    S.config.maxDistance = +document.getElementById('cMaxDist').value || 500;
    await API.put('/api/config', S.config);
    document.getElementById('officeMsg').innerHTML = '<span style="color:var(--green)">✓ Office location saved!</span>';
    setTimeout(() => render(), 800);
  });
  
  // Export employee attendance
  document.getElementById('empExportAtt')?.addEventListener('click', () => {
    const emp = S.employees.find(e => e.id === S.viewEmpId);
    const rows = S.attendance.filter(a => a.employeeId === emp.id).map(a => ({
      date: a.date, checkIn: a.checkIn||'', checkOut: a.checkOut||'',
      workedMin: a.workedMinutes||0, lateMin: a.lateMinutes||0, otMin: a.overtimeMinutes||0,
      checkInLocation: a.location?.label||'', lat: a.location?.lat||'', lng: a.location?.lng||'',
      mode: a.mode||'office'
    }));
    exportCSV(`${emp.name.replace(/\s/g,'_')}-attendance.csv`, rows, ['date','checkIn','checkOut','workedMin','lateMin','otMin','checkInLocation','lat','lng','mode']);
  });
}

function logout() {
  if (S.scanner) stopScanner();
  API.setToken(null);
  S.user = null; S.role = null; S.view = 'landing';
  S.adminTab = 'dashboard'; S.empTab = 'dashboard'; S.search = '';
  S.viewEmpId = null; S.viewingSlipId = null;
  render();
}

// ==================== SCANNER ====================
async function startScanner() {
  S.scanning = true; render();
  let loc = null;
  try {
    loc = await new Promise(resolve => {
      if (!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition(async pos => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        const accuracy = Math.round(pos.coords.accuracy);
        let label = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
        try {
          const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=16`);
          const d = await r.json();
          if (d.display_name) label = d.display_name;
        } catch {}
        resolve({ lat, lng, label, accuracy, capturedAt: new Date().toISOString(), ua: navigator.userAgent.substring(0,80) });
      }, () => resolve(null), { enableHighAccuracy:true, timeout:10000 });
    });
  } catch {}
  S.empLocation = loc;
  
  setTimeout(() => {
    try {
      S.scanner = new Html5Qrcode("qrReader");
      S.scanner.start({ facingMode: "environment" }, { fps:10, qrbox:{ width:250, height:250 } }, onScan, () => {})
        .catch(err => {
          document.getElementById('scanMsg').innerHTML = `<span style="color:var(--red)">Camera error: ${err.message||err}</span>`;
          S.scanning = false;
        });
    } catch (e) {
      document.getElementById('scanMsg').innerHTML = `<span style="color:var(--red)">${e.message}</span>`;
    }
  }, 100);
}

async function stopScanner() {
  if (S.scanner) { try { await S.scanner.stop(); } catch {} S.scanner = null; }
  S.scanning = false; render();
}

async function onScan(decoded) {
  await stopScanner();
  try {
    const result = await API.post('/api/attendance/scan', { qrCode: decoded, location: S.empLocation });
    if (result.action === 'check-in') {
      alert(`✅ Check-In at ${result.time}\n${result.lateMinutes > 0 ? `⚠ Late by ${fmtDur(result.lateMinutes)}` : '✓ On-Time'}`);
    } else if (result.action === 'check-out') {
      const outMsg = result.outStatus === 'overtime' ? `⏰ Overtime: ${fmtDur(result.overtimeMinutes)}` :
                     result.outStatus === 'early-out' ? `⚠ Early-Out by ${fmtDur(result.earlyOutMinutes)}` : '✓ On-Time';
      alert(`✅ Check-Out at ${result.time}\nWorked: ${fmtDur(result.workedMinutes)}\n${outMsg}`);
    }
    await refreshData();
  } catch (e) {
    document.getElementById('scanMsg').innerHTML = `<span style="color:var(--red)">❌ ${e.message}</span>`;
    render();
  }
}

// ==================== CSV EXPORTS ====================
function exportCSV(filename, rows, fields) {
  if (rows.length === 0) { alert('No data to export'); return; }
  const header = fields.join(',');
  const csv = [header, ...rows.map(r => fields.map(f => {
    let v = f.split('.').reduce((o,k) => o?.[k], r) || '';
    v = String(v).replace(/"/g,'""');
    return /[,"\n]/.test(v) ? `"${v}"` : v;
  }).join(','))].join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}

function exportAttendanceCSV(all = false) {
  const m = S.selMonth, y = S.selYear;
  const data = all ? S.attendance : S.attendance.filter(a => a.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`));
  const rows = data.map(a => {
    const e = S.employees.find(x => x.id === a.employeeId);
    return {
      name: e?.name || '?', code: e?.employeeCode || '', dept: e?.department || '',
      date: a.date, checkIn: a.checkIn || '', checkOut: a.checkOut || '',
      workedMin: a.workedMinutes || 0, lateMin: a.lateMinutes || 0, otMin: a.overtimeMinutes || 0,
      location: a.location?.label || '', mode: a.mode || 'office'
    };
  });
  exportCSV(all ? 'attendance-all.csv' : `attendance-${monthName(m)}-${y}.csv`, rows,
    ['name','code','dept','date','checkIn','checkOut','workedMin','lateMin','otMin','location','mode']);
}

function exportPayrollCSV() {
  const m = S.selMonth, y = S.selYear;
  const rows = S.employees.filter(e=>e.status==='active').map(e => {
    const p = calcPayroll(e, m, y);
    return {
      name: e.name, code: e.employeeCode, dept: e.department,
      workingDays: p.workingDays, presentDays: p.presentDays, paidLeave: p.paidLeaveDays.toFixed(1), lop: p.lopDays.toFixed(1),
      lateMin: p.totalLateMin, otMin: p.totalOTMin,
      basic: p.earnings.basic, hra: p.earnings.hra, allowances: p.earnings.allowances, otBonus: p.earnings.otBonus,
      grossEarnings: p.earnings.total, pf: p.deductions.pf, lopDeduction: p.deductions.lop, lateDeduction: p.deductions.late,
      totalDeductions: p.deductions.total, netSalary: p.netSalary
    };
  });
  exportCSV(`payroll-${monthName(m)}-${y}.csv`, rows,
    ['name','code','dept','workingDays','presentDays','paidLeave','lop','lateMin','otMin','basic','hra','allowances','otBonus','grossEarnings','pf','lopDeduction','lateDeduction','totalDeductions','netSalary']);
}

// ==================== BOOT ====================
(async function boot() {
  // Try to restore session from token
  if (API.token) {
    try {
      const me = await API.get('/api/auth/me');
      S.user = me;
      S.role = me.role;
      S.view = me.role === 'admin' ? 'admin' : 'employee';
      await init();
    } catch (e) {
      API.setToken(null);
    }
  }
  render();
})();
</script>
