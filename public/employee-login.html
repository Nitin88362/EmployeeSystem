<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login - Editone HRMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #111111;
            --border: #222222;
            --text: #ffffff;
            --muted: #999999;
            --orange: #ff6a00;
            --green: #10b981;
            --red: #ef4444;
            --blue: #3b82f6;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
        }
        .input {
            background: #1a1a1a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem;
            color: var(--text);
            width: 100%;
            transition: all 0.2s;
        }
        .input:focus {
            outline: none;
            border-color: var(--orange);
            box-shadow: 0 0 0 2px rgba(255,106,0,0.2);
        }
        .btn {
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-primary {
            background: var(--orange);
            color: white;
        }
        .btn-primary:hover {
            background: #ff5500;
            transform: translateY(-1px);
        }
        .btn-ghost {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover {
            color: var(--orange);
            border-color: var(--orange);
        }
        .label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--muted);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-6">
    <div class="card max-w-md w-full">
        <button onclick="window.location.href='/'" class="text-sm text-[var(--muted)] hover:text-[var(--orange)] mb-4">← Back</button>
        
        <div class="w-14 h-14 rounded-xl flex items-center justify-center mb-5" style="background:rgba(16,185,129,.15);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2.5">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        </div>
        
        <h2 class="text-2xl font-bold mb-1">Employee Login</h2>
        <p class="text-sm text-[var(--muted)] mb-6">Apna email aur password daalein</p>
        
        <div class="space-y-3">
            <div>
                <label class="label">Email</label>
                <input id="email" class="input" placeholder="you@editone.in" />
            </div>
            <div>
                <label class="label">Password</label>
                <input id="password" type="password" class="input" placeholder="••••••••" />
            </div>
            <button id="loginBtn" class="btn btn-primary w-full justify-center">
                Employee Login →
            </button>
        </div>
        
        <div class="mt-6 text-xs text-[var(--muted)]">
            Demo: demo@editone.in / demo123
        </div>
    </div>

    <script>
        const API = {
            post: async (url, data) => {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (!res.ok) throw new Error('Login failed');
                return res.json();
            }
        };

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                alert('Email aur password dono required hain');
                return;
            }
            
            try {
                const result = await API.post('/api/auth/employee-login', { email, password });
                
                // Store token and user data
                localStorage.setItem('hrms_token', result.token);
                localStorage.setItem('hrms_user', JSON.stringify(result.user));
                
                // Redirect to main app
                window.location.href = '/';
            } catch (error) {
                alert('Invalid email ya password');
            }
        });

        // Allow Enter key to submit
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('loginBtn').click();
            }
        });
    </script>
</body>
</html>
